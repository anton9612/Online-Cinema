<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Онлайн-кинотеатр</title>
        
    </head>
    <body>
        <h1>Кинотеатр</h1>
        <h2>Жанры</h2>
        <ul>
            {% for genre in genres %}
            <li>{{genre}}</li>
            {% endfor %}
        </ul>

        <h2>Фильмы</h2>
        <ul>
            {% for movie in movies %}
            <li>
                {{movie.title}} - {{movie.genre}}
                {{movie.description}}
            </li>
            {% endfor %}
        </ul>


    </body>



</html>
